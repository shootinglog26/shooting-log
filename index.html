  function SessionModal() {
    if(!showSessionForm) return null;
    const isEdit = editItem?._type === "session";
    const save = () => {
      if (isEdit) {
        // Edit: update in place, don't touch ammo stock (rounds may have changed but
        // re-deducting would double count - user can manually adjust ammo if needed)
        setSessions(ss=>ss.map(x=>x.id===editItem.id ? {...newSession, id:editItem.id} : x));
        setShowSessionForm(false); setEditItem(null); setNewSession(blankSession);
        return;
      }
      const s={...newSession,id:gid()};
      setSessions(ss=>[...ss,s]);
      const chosenCals = (newSession.firearmIds||[]).map(id=>firearms.find(f=>f.id===id)?.calibre).filter(Boolean);
      if(newSession.rounds>0){
        if(newSession.ammoId){
          setAmmoStock(a=>a.map(x=>x.id===newSession.ammoId?{...x,qty:Math.max(0,x.qty-newSession.rounds)}:x));
        } else if(chosenCals.length){
          // Fallback: draw rounds down from any matching-calibre batches
          setAmmoStock(a=>{
            let rem=newSession.rounds;
            return a.map(x=>{
              if(rem>0&&chosenCals.includes(x.calibre)&&x.qty>0){
                const take=Math.min(x.qty,rem); rem-=take; return {...x,qty:x.qty-take};
              }
              return x;
            });
          });
        }
      }
      setShowSessionForm(false); setNewSession(blankSession);
    };
    return <div className="ov" onClick={e=>{if(e.target===e.currentTarget){setShowSessionForm(false);setEditItem(null);}}}>
      <div className="modal">
        <div className="mt">{isEdit?"Edit Session":"New Session"}<button className="xb" onClick={()=>{setShowSessionForm(false);setEditItem(null);}}>×</button></div>
        <div className="row">
          <div className="fld"><div className="lbl">Date</div><input className="inp" type="date" value={newSession.date} onChange={e=>setNewSession(s=>({...s,date:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">Purpose</div>
            <select className="inp" value={newSession.purpose} onChange={e=>setNewSession(s=>({...s,purpose:e.target.value}))}>
              <option value="target">Target Shooting</option><option value="pest">Pest Control</option>
              <option value="stalking">Deer Stalking</option><option value="rough">Rough Shooting</option>
              <option value="driven">Driven Game</option><option value="wildfowling">Wildfowling</option>
              <option value="clay">Clay Shooting</option><option value="zero">Zeroing / Sighting In</option>
              <option value="practice">Practice / Training</option>
            </select>
          </div>
        </div>
        <div className="row">
          <div className="fld">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div className="lbl" style={{marginBottom:0}}>Location</div>
              <button className="btn bsm" style={{padding:"2px 8px",fontSize:11}} onClick={()=>{setEditItem(null);setNewLocation({name:"",type:"",county:"",notes:""});setShowLocationForm(true);}}>+ New</button>
            </div>
            <select className="inp" value={newSession.locationId} onChange={e=>setNewSession(s=>({...s,locationId:e.target.value}))}>
              <option value="">Select</option>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </div>
          <div className="fld">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div className="lbl" style={{marginBottom:0}}>Firearms (tap to include — multiple allowed)</div>
              <button className="btn bsm" style={{padding:"2px 8px",fontSize:11}} onClick={()=>{setEditItem(null);setNewFirearm(blankFirearm);setShowFirearmForm(true);}}>+ New</button>
            </div>
            {firearms.length===0
              ?<p style={{fontSize:12,color:t.textMuted,fontStyle:"italic"}}>No firearms added yet — tap + New</p>
              :<div className="qg">
                {firearms.map(f=>{
                  const sel = (newSession.firearmIds||[]).includes(f.id);
                  return <button key={f.id} className={`qi ${sel?"sel":""}`}
                    onClick={()=>setNewSession(s=>{
                      const ids = s.firearmIds||[];
                      const next = ids.includes(f.id) ? ids.filter(x=>x!==f.id) : [...ids,f.id];
                      // Reset ammo selection if it no longer matches any chosen firearm's calibre
                      const chosenCalibres = next.map(id=>firearms.find(g=>g.id===id)?.calibre).filter(Boolean);
                      const ammoStillValid = !s.ammoId || chosenCalibres.includes(ammoStock.find(a=>a.id===s.ammoId)?.calibre);
                      return {...s, firearmIds: next, ammoId: ammoStillValid ? s.ammoId : ""};
                    })}>
                    {f.name} ({f.calibre}){sel && <strong> ✓</strong>}
                  </button>;
                })}
              </div>
            }
          </div>
        </div>
        {(()=>{
          const chosen = (newSession.firearmIds||[]).map(id=>firearms.find(f=>f.id===id)).filter(Boolean);
          const cals = [...new Set(chosen.map(f=>f.calibre))];
          const matching = chosen.length ? ammoStock.filter(a=>cals.includes(a.calibre)) : [];
          const calLabel = cals.length===1 ? `(${cals[0]})` : cals.length>1 ? `(${cals.join(", ")})` : "";
          return <div className="fld">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div className="lbl" style={{marginBottom:0}}>Ammo Used {calLabel}</div>
              <button className="btn bsm" style={{padding:"2px 8px",fontSize:11}} disabled={!chosen.length}
                onClick={()=>{
                  setEditItem(null);
                  setNewAmmo({calibre:cals[0]||"",qty:0,brand:"",type:"",weight:"",lot:"",purchased:td(),notes:""});

              {matching.map(a=><option key={a.id} value={a.id}>{a.calibre} · {a.brand||"Unbranded"}{a.weight?` ${a.weight}gr`:""}{a.type?` ${a.type}`:""} — {a.qty} rds left</option>)}

          <div className="fld"><div className="lbl">Rounds Fired</div>

          </div>
          <div className="fld"><div className="lbl">Distance (m)</div><input className="inp" type="number" value={newSession.distance} onChange={e=>setNewSession(s=>({...s,distance:e.target.value}))} placeholder="100"/></div>
        </div>
        <hr className="dvd"/>
        <div className="lbl" style={{marginBottom:7}}>Weather Conditions</div>
        <div className="row">
          <div className="fld"><div className="lbl">Conditions</div>
            <select className="inp" value={newSession.weather} onChange={e=>setNewSession(s=>({...s,weather:e.target.value}))}>
              <option value="">Select</option>{WEATHER_CONDITIONS.map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
          <div className="fld"><div className="lbl">Wind Direction</div>
            <select className="inp" value={newSession.wind} onChange={e=>setNewSession(s=>({...s,wind:e.target.value}))}>
              <option value="">Select</option>{WIND_DIRECTIONS.map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Wind Speed (mph)</div><input className="inp" type="number" value={newSession.windSpeed} onChange={e=>setNewSession(s=>({...s,windSpeed:e.target.value}))} placeholder="0"/></div>
          <div className="fld"><div className="lbl">Temperature (°C)</div><input className="inp" type="number" value={newSession.temp} onChange={e=>setNewSession(s=>({...s,temp:e.target.value}))} placeholder="15"/></div>
        </div>
        {QUARRY_PURPOSES.includes(newSession.purpose) && <div>
          <hr className="dvd"/>
          <div className="lbl" style={{marginBottom:7}}>Quarry Bag — UK Legal Only</div>
          <div className="qg">
            {UK_QUARRY.map(q=>(
              <button key={q} className={`qi ${(newSession.quarryBag[q]||0)>0?"sel":""}`}
                onClick={()=>setNewSession(s=>({...s,quarryBag:{...s.quarryBag,[q]:(s.quarryBag[q]||0)+1}}))}>
                {q}{(newSession.quarryBag[q]||0)>0&&<strong> ×{newSession.quarryBag[q]}</strong>}
              </button>
            ))}
          </div>
          {Object.values(newSession.quarryBag).some(v=>v>0)&&
            <button className="btn bsm bdg" style={{marginTop:7}} onClick={()=>setNewSession(s=>({...s,quarryBag:{}}))}>Clear Bag</button>}

          <div className="lbl">Target Photos</div>

            onChange={e=>readImg(e.target.files[0],d=>setNewSession(s=>({...s,targetPhotos:[...s.targetPhotos,d]})))}/>

            {newSession.targetPhotos.map((p,i)=>(
              <div key={i} style={{position:"relative"}}>

          <button className="btn" onClick={()=>{setShowSessionForm(false);setEditItem(null);}}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  function AmmoModal() {
    if(!showAmmoForm) return null;
    const save = () => {
      if(!newAmmo.calibre) return;
      if(editItem?._type==="ammo"){
        // Edit mode: update in place
        setAmmoStock(a=>a.map(x=>x.id===editItem.id?{...newAmmo,qty:parseInt(newAmmo.qty)||0,id:editItem.id}:x));
      } else {
        const ex=ammoStock.find(a=>a.calibre===newAmmo.calibre&&a.brand===newAmmo.brand&&a.weight===newAmmo.weight);
        if(ex) setAmmoStock(a=>a.map(x=>x.id===ex.id?{...x,qty:x.qty+(parseInt(newAmmo.qty)||0)}:x));
        else setAmmoStock(a=>[...a,{...newAmmo,qty:parseInt(newAmmo.qty)||0,id:gid()}]);
      }
      setShowAmmoForm(false); setEditItem(null); setNewAmmo(blankAmmo);
    };
    // Detect firearm type from chosen calibre so ammo "type" dropdown can be filtered
    const ftype = Object.entries(CALIBRES_BY_TYPE).find(([,arr])=>arr.includes(newAmmo.calibre))?.[0];
    const ammoTypeOpts = ftype?AMMO_TYPES_BY_FTYPE[ftype]:[];
    return <div className={`ov ${showSessionForm?"ov2":""}`} onClick={e=>{if(e.target===e.currentTarget){setShowAmmoForm(false);setEditItem(null);}}}>
      <div className="modal">
        <div className="mt">{editItem?"Edit Ammunition":"Add Ammunition"}<button className="xb" onClick={()=>{setShowAmmoForm(false);setEditItem(null);}}>×</button></div>
        <div className="fld"><div className="lbl">Calibre * <span style={{fontWeight:"normal",color:t.textMuted}}>(pick or type your own)</span></div>
          <input className="inp" list="calibre-list-ammo" value={newAmmo.calibre}
            onChange={e=>setNewAmmo(a=>({...a,calibre:e.target.value,type:""}))}
            placeholder="Select or type calibre"/>
          <datalist id="calibre-list-ammo">
            {CALIBRES.map(x=><option key={x} value={x}/>)}
          </datalist>
        </div>
        {newAmmo.calibre && (() => {
          const matching = AMMO_LIBRARY.filter(a=>a.cal===newAmmo.calibre);
          if (!matching.length) return null;
          return <div className="fld">
            <div className="lbl">Quick-fill from Factory Library ({matching.length} loads)</div>
            <select className="inp" value="" onChange={e=>{
              if (!e.target.value) return;
              const pick = matching[parseInt(e.target.value)];
              setNewAmmo(a=>({...a,
                brand: pick.brand,
                type: pick.type,
                weight: String(pick.weight),
                muzzleVelocity: String(pick.mv),
                bc: pick.bc ? String(pick.bc) : "",
                bcG7: pick.bcG7 ? String(pick.bcG7) : "",
                dragModel: pick.model || "g1",
              }));
            }}>
              <option value="">— Pick a load to auto-fill —</option>
              {matching.map((a,i)=><option key={i} value={i}>{a.brand} {a.type} {a.weight}gr{a.note?` — ${a.note}`:""}</option>)}
            </select>
            <p style={{fontSize:10,color:t.textMuted,marginTop:4,fontStyle:"italic"}}>
              Auto-fills brand, type, weight, MV and BC. Edit any field after if needed (e.g. your chronograph reading).
            </p>
          </div>;
        })()}
        <div className="row">
          <div className="fld"><div className="lbl">Brand</div><input className="inp" value={newAmmo.brand} onChange={e=>setNewAmmo(a=>({...a,brand:e.target.value}))} placeholder="e.g. Hornady"/></div>
          <div className="fld"><div className="lbl">Weight (gr)</div><input className="inp" type="number" value={newAmmo.weight} onChange={e=>setNewAmmo(a=>({...a,weight:e.target.value}))} placeholder="e.g. 55"/></div>
        </div>
        <div className="fld"><div className="lbl">Projectile / Type</div>
          {ammoTypeOpts.length>0
            ?<select className="inp" value={newAmmo.type} onChange={e=>setNewAmmo(a=>({...a,type:e.target.value}))}>
              <option value="">Select</option>{ammoTypeOpts.map(x=><option key={x}>{x}</option>)}
              <option value="Other">Other (type below)</option>
            </select>
            :<input className="inp" value={newAmmo.type} onChange={e=>setNewAmmo(a=>({...a,type:e.target.value}))} placeholder="e.g. BTHP"/>
          }
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Quantity (rounds)</div><input className="inp" type="number" value={newAmmo.qty} onChange={e=>setNewAmmo(a=>({...a,qty:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">Purchased</div><input className="inp" type="date" value={newAmmo.purchased} onChange={e=>setNewAmmo(a=>({...a,purchased:e.target.value}))}/></div>
        </div>
        <div className="fld"><div className="lbl">Lot / Batch No.</div><input className="inp" value={newAmmo.lot} onChange={e=>setNewAmmo(a=>({...a,lot:e.target.value}))} placeholder="Optional"/></div>
        <hr className="dvd"/>
        <div className="lbl" style={{marginBottom:8,fontSize:12,color:t.accent}}>Ballistic Data (optional — used by calculator)</div>
        <div className="row">
          <div className="fld"><div className="lbl">Muzzle Velocity (fps)</div><input className="inp" type="number" value={newAmmo.muzzleVelocity} onChange={e=>setNewAmmo(a=>({...a,muzzleVelocity:e.target.value}))} placeholder="e.g. 2900"/></div>
          <div className="fld"><div className="lbl">Preferred Drag Model</div>
            <select className="inp" value={newAmmo.dragModel||"g1"} onChange={e=>setNewAmmo(a=>({...a,dragModel:e.target.value}))}>
              <option value="g1">G1 (flat-base bullets)</option>
              <option value="g7">G7 (boat-tail bullets)</option>
            </select>
          </div>
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">G1 BC</div><input className="inp" type="number" step="0.001" value={newAmmo.bc} onChange={e=>setNewAmmo(a=>({...a,bc:e.target.value}))} placeholder="e.g. 0.450"/></div>
          <div className="fld"><div className="lbl">G7 BC</div><input className="inp" type="number" step="0.001" value={newAmmo.bcG7} onChange={e=>setNewAmmo(a=>({...a,bcG7:e.target.value}))} placeholder="e.g. 0.225"/></div>
        </div>
        <p style={{fontSize:11,color:t.textMuted,marginTop:-4,marginBottom:10,fontStyle:"italic"}}>G1 BC works for most factory ammo. G7 is more accurate for long, boat-tail match bullets. Use whichever the manufacturer publishes — G7 BCs are roughly half the G1 value.</p>
        <hr className="dvd"/>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newAmmo.notes} onChange={e=>setNewAmmo(a=>({...a,notes:e.target.value}))} placeholder="e.g. zeroed at 100m, MOA group"/></div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn bsl" onClick={save}>{editItem?"Update":"Save"}</button>
          <button className="btn" onClick={()=>{setShowAmmoForm(false);setEditItem(null);}}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  function ShopModal() {
    if(!showShopForm) return null;
    const save = () => {
      if(!newShop.name || !newShop.url) return;
      let url = newShop.url.trim();
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      const shop = {...newShop, url};
      if(editItem?._type==="shop") setShops(s=>s.map(x=>x.id===editItem.id?{...shop,id:editItem.id}:x));
      else setShops(s=>[...s,{...shop,id:gid()}]);
      setShowShopForm(false); setEditItem(null); setNewShop(blankShop);
    };
    return <div className="ov" onClick={e=>{if(e.target===e.currentTarget){setShowShopForm(false);setEditItem(null);}}}>
      <div className="modal">
        <div className="mt">{editItem?"Edit Shop":"Add Shop"}<button className="xb" onClick={()=>{setShowShopForm(false);setEditItem(null);}}>×</button></div>
        <div className="fld"><div className="lbl">Shop Name *</div><input className="inp" value={newShop.name} onChange={e=>setNewShop(s=>({...s,name:e.target.value}))} placeholder="e.g. Dauntsey Guns"/></div>
        <div className="fld"><div className="lbl">Website URL *</div><input className="inp" value={newShop.url} onChange={e=>setNewShop(s=>({...s,url:e.target.value}))} placeholder="dauntseyguns.co.uk"/></div>
        <div className="row">
          <div className="fld"><div className="lbl">Category</div>
            <select className="inp" value={newShop.category} onChange={e=>setNewShop(s=>({...s,category:e.target.value}))}>
              <option>Local</option><option>National</option><option>Marketplace</option><option>Reloading</option><option>Optics</option><option>Clothing</option><option>Clay Ground</option><option>Stalking</option><option>Gunsmith</option><option>Other</option>
            </select>
          </div>
          <div className="fld"><div className="lbl">Location</div><input className="inp" value={newShop.location} onChange={e=>setNewShop(s=>({...s,location:e.target.value}))} placeholder="e.g. Wiltshire"/></div>
        </div>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newShop.notes} onChange={e=>setNewShop(s=>({...s,notes:e.target.value}))} placeholder="What they specialise in, your experience..."/></div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn bsl" onClick={save}>{editItem?"Update":"Save"}</button>
          <button className="btn" onClick={()=>{setShowShopForm(false);setEditItem(null);}}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  function HiatusModal() {
    if(!showHiatusForm) return null;
    const save = () => {
      if(!newHiatus.startDate || !newHiatus.endDate) return;
      if (newHiatus.endDate < newHiatus.startDate) {
        alert("End date must be on or after start date.");
        return;
      }
      if(editItem?._type==="hiatus") setHiatus(hs=>hs.map(x=>x.id===editItem.id?{...newHiatus,id:editItem.id}:x));
      else setHiatus(hs=>[...hs,{...newHiatus,id:gid()}]);
      setShowHiatusForm(false); setEditItem(null); setNewHiatus(blankHiatus);
    };
    return <div className="ov" onClick={e=>{if(e.target===e.currentTarget){setShowHiatusForm(false);setEditItem(null);}}}>
      <div className="modal">
        <div className="mt">{editItem?"Edit Non-Shooting Period":"Log Non-Shooting Period"}<button className="xb" onClick={()=>{setShowHiatusForm(false);setEditItem(null);}}>×</button></div>
        <div style={{background:t.accentBg,border:`1px solid ${t.accent}44`,borderRadius:8,padding:9,marginBottom:11,fontSize:12,color:t.textMuted,lineHeight:1.4}}>
          Logging periods you didn't shoot gives your FEO a complete picture and explains gaps in your activity record.
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Start Date *</div><input className="inp" type="date" value={newHiatus.startDate} onChange={e=>setNewHiatus(h=>({...h,startDate:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">End Date *</div><input className="inp" type="date" value={newHiatus.endDate} onChange={e=>setNewHiatus(h=>({...h,endDate:e.target.value}))}/></div>
        </div>
        <div className="fld"><div className="lbl">Reason</div>
          <select className="inp" value={newHiatus.reason} onChange={e=>setNewHiatus(h=>({...h,reason:e.target.value}))}>
            <option>Holiday</option>
            <option>Illness</option>
            <option>Injury</option>
            <option>Work Commitments</option>
            <option>Out of Season</option>
            <option>Firearm at Gunsmith</option>
            <option>Weather</option>
            <option>Family / Personal</option>
            <option>Bereavement</option>
            <option>Awaiting Certificate</option>
            <option>Other</option>
          </select>
        </div>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newHiatus.notes} onChange={e=>setNewHiatus(h=>({...h,notes:e.target.value}))} placeholder="Optional detail (e.g. broken collarbone, summer holiday in Italy)"/></div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn bsl" onClick={save}>{editItem?"Update":"Save"}</button>
          <button className="btn" onClick={()=>{setShowHiatusForm(false);setEditItem(null);}}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  const PAGES = {dashboard:Dashboard,firearms:Firearms,ammo:Ammo,locations:Locations,sessions:Sessions,planner:Planner,land:Land,maintenance:Maintenance,shops:Shops,stats:Stats,calc:Calculator,feo:FEO,settings:Settings};

  return (
    <div className="app">
      <style dangerouslySetInnerHTML={{__html:css}}/>
      {theme==="night"&&<div className="nvscan"/>}
      <nav className="nav">
        <div className="nav-inner">
          {NAV.map(n=>(
            <button key={n.id} className={`nb ${page===n.id?"active":""}`} onClick={()=>setPage(n.id)}>
              <Icon name={n.icon} size={16}/>{n.label}
            </button>
          ))}
        </div>
      </nav>
      {(PAGES[page]||Dashboard)()}
      {FirearmModal()}
      {LocationModal()}
      {SessionModal()}
      {AmmoModal()}
      {LandModal()}
      {MaintModal()}
      {PlanModal()}
      {ShopModal()}
      {HiatusModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</body>
</html>
