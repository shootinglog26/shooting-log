    accent:"#00ff41",accentBg:"#001a00",input:"#0a0f0a",nav:"#060610",
    shadow:"0 0 20px rgba(0,255,65,0.15)",badge:"#001a00",badgeText:"#00ff41",
    danger:"#ff0040",success:"#00ff41",headerBg:"linear-gradient(135deg,#060610,#0a0f0a)",mono:true
  };
  if (mode === "light") return {
    bg:"#f5f0e8",card:"#fffdf8",border:"#d4c9b0",text:"#2a1f0e",textMuted:"#7a6a52",
    accent:"#8B4513",accentBg:"#f0e8d8",input:"#fffdf8",nav:"#2a1f0e",

  function readImg(file,cb){
    if(!file||!file.type.startsWith("image/"))return;
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        // Resize so the longest side is <= 1000px, then compress to JPEG
        const MAX=1000;
        let {width,height}=img;
        if(width>height && width>MAX){ height=Math.round(height*MAX/width); width=MAX; }
        else if(height>MAX){ width=Math.round(width*MAX/height); height=MAX; }
        const c=document.createElement("canvas");
        c.width=width; c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        try { cb(c.toDataURL("image/jpeg",0.7)); }
        catch(err){ cb(e.target.result); } // fallback to original if canvas tainted
      };
      img.onerror=()=>cb(e.target.result);
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  }

  // FEO export
  // ---- BACKUP / RESTORE ----
  function exportData() {
    const data = {
      version: 1, exported: new Date().toISOString(),
      firearms, locations, sessions, ammoStock, land, maintenance, feo, theme
    };
    const b = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const u = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = u;
    a.download = `shooting-log-backup-${td()}.json`;
    a.click();
    URL.revokeObjectURL(u);
  }

  function importData(file) {
    if(!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if(!confirm("This will REPLACE all current data with the backup. Continue?")) return;
        if(d.firearms) setFirearms(d.firearms);
        if(d.locations) setLocations(d.locations);
        if(d.sessions) setSessions(d.sessions);
        if(d.ammoStock) setAmmoStock(d.ammoStock);
        if(d.land) setLand(d.land);
        if(d.maintenance) setMaintenance(d.maintenance);
        if(d.feo) setFeo(d.feo);
        if(d.theme) setTheme(d.theme);
        alert("Backup restored successfully.");
      } catch(err) {

  function generateFEO() {
    const rows = sessions.map(s => {
      const loc = locations.find(l=>l.id===s.locationId);
      const gun = firearms.find(f=>f.id===s.firearmId);
      const q = Object.entries(s.quarryBag||{}).filter(([,v])=>v>0).map(([k,v])=>`${k}: ${v}`).join(", ");
      return `<tr><td>${fmt(s.date)}</td><td>${loc?.name||"—"}</td><td>${gun?.name||"—"}</td><td>${gun?.calibre||"—"}</td><td>${s.rounds}</td><td>${q||"—"}</td><td>${s.notes||"—"}</td></tr>`;
    }).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shooting Record</title>
    <style>body{font-family:Georgia,serif;margin:40px;color:#1a1a1a}h1{color:#5a3a1a;border-bottom:2px solid #8B4513;padding-bottom:10px}
    .hi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;font-size:13px}.hi p{margin:3px 0}.lb{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:1px}
    table{width:100%;border-collapse:collapse;margin-top:20px;font-size:12px}th{background:#5a3a1a;color:white;padding:8px;text-align:left;font-size:11px;text-transform:uppercase}
    td{padding:7px 8px;border-bottom:1px solid #ddd}tr:nth-child(even){background:#f9f5f0}
    .ft{margin-top:30px;font-size:11px;color:#888;border-top:1px solid #ccc;padding-top:10px}</style></head><body>
    <h1>SHOOTING RECORD — FAC/SGC COMPLIANCE LOG</h1>
    <div class="hi">
      <div><p class="lb">Name</p><p>${feo.name||"—"}</p></div>
      <div><p class="lb">Address</p><p>${feo.address||"—"}</p></div>
      <div><p class="lb">FAC Number</p><p>${feo.fac||"—"}</p></div><div><p class="lb">FAC Expiry</p><p>${fmt(feo.facExpiry)}</p></div>
      <div><p class="lb">SGC Number</p><p>${feo.sgc||"—"}</p></div><div><p class="lb">SGC Expiry</p><p>${fmt(feo.sgcExpiry)}</p></div>
      <div><p class="lb">FEO Name</p><p>${feo.feoName||"—"}</p></div><div><p class="lb">FEO Contact</p><p>${feo.feoContact||"—"}</p></div>
    </div>
    <table><thead><tr><th>Date</th><th>Location</th><th>Firearm</th><th>Calibre</th><th>Rounds</th><th>Quarry</th><th>Notes</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="ft">Generated ${new Date().toLocaleDateString("en-GB")} — Sessions: ${sessions.length} — Total rounds: ${totalRounds}</div>
    </body></html>`;
    const b=new Blob([html],{type:"text/html"});
    const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download="shooting_record.html";a.click();
    URL.revokeObjectURL(u);
  }

  function SessionModal() {
    if(!showSessionForm) return null;
    const save = () => {
      const s={...newSession,id:gid()};
      setSessions(ss=>[...ss,s]);
      const gun=firearms.find(f=>f.id===newSession.firearmId);
      if(newSession.rounds>0){
        if(newSession.ammoId){
          // deduct from the specific selected batch
          setAmmoStock(a=>a.map(x=>x.id===newSession.ammoId?{...x,qty:Math.max(0,x.qty-newSession.rounds)}:x));
        } else if(gun){
          // fallback: deduct from first matching calibre batch with stock
          setAmmoStock(a=>{
            let rem=newSession.rounds;
            return a.map(x=>{
              if(rem>0&&x.calibre===gun.calibre&&x.qty>0){
                const take=Math.min(x.qty,rem); rem-=take; return {...x,qty:x.qty-take};
              }
              return x;
            });
          });
        }
      }
      setShowSessionForm(false); setNewSession(blankSession);
    };
    return <div className="ov" onClick={e=>{if(e.target.classList.contains("ov"))setShowSessionForm(false);}}>
      <div className="modal">
        <div className="mt">New Session<button className="xb" onClick={()=>setShowSessionForm(false)}>×</button></div>
        <div className="row">
          <div className="fld"><div className="lbl">Date</div><input className="inp" type="date" value={newSession.date} onChange={e=>setNewSession(s=>({...s,date:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">Purpose</div>
            <select className="inp" value={newSession.purpose} onChange={e=>setNewSession(s=>({...s,purpose:e.target.value}))}>
              <option value="target">Target Shooting</option><option value="pest">Pest Control</option>
              <option value="stalking">Deer Stalking</option><option value="rough">Rough Shooting</option>
              <option value="driven">Driven Game</option><option value="clay">Clay Shooting</option>
            </select>
          </div>
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Location</div>
            <select className="inp" value={newSession.locationId} onChange={e=>setNewSession(s=>({...s,locationId:e.target.value}))}>
              <option value="">Select</option>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </div>
          <div className="fld"><div className="lbl">Firearm</div>
            <select className="inp" value={newSession.firearmId} onChange={e=>setNewSession(s=>({...s,firearmId:e.target.value,ammoId:""}))}>
              <option value="">Select</option>{firearms.map(f=><option key={f.id} value={f.id}>{f.name} ({f.calibre})</option>)}
            </select>
          </div>
        </div>
        {(()=>{
          const gun=firearms.find(f=>f.id===newSession.firearmId);
          const matching=gun?ammoStock.filter(a=>a.calibre===gun.calibre):[];
          return <div className="fld"><div className="lbl">Ammo Used {gun?`(${gun.calibre})`:""}</div>
            <select className="inp" value={newSession.ammoId} onChange={e=>setNewSession(s=>({...s,ammoId:e.target.value}))} disabled={!gun}>
              <option value="">{!gun?"Select firearm first":matching.length?"Select ammo batch":"No matching ammo in stock"}</option>
              {matching.map(a=><option key={a.id} value={a.id}>{a.brand||"Unbranded"}{a.type?` ${a.type}`:""} — {a.qty} rds left</option>)}
            </select>
          </div>;
        })()}
        <div className="row">
          <div className="fld"><div className="lbl">Rounds Fired</div>
            <div className="ci">
              <button className="cbtn" onClick={()=>setNewSession(s=>({...s,rounds:Math.max(0,s.rounds-1)}))}>−</button>
              <span className="cv">{newSession.rounds}</span>
              <button className="cbtn" onClick={()=>setNewSession(s=>({...s,rounds:s.rounds+1}))}>+</button>
              <input className="inp" type="number" value={newSession.rounds} onChange={e=>setNewSession(s=>({...s,rounds:parseInt(e.target.value)||0}))} style={{width:70}}/>
            </div>
          </div>
          <div className="fld"><div className="lbl">Distance (m)</div><input className="inp" type="number" value={newSession.distance} onChange={e=>setNewSession(s=>({...s,distance:e.target.value}))} placeholder="100"/></div>
        </div>
        <hr className="dvd"/>
        <div className="lbl" style={{marginBottom:7}}>Weather Conditions</div>
        <div className="row">
          <div className="fld"><div className="lbl">Conditions</div>
            <select className="inp" value={newSession.weather} onChange={e=>setNewSession(s=>({...s,weather:e.target.value}))}>
              <option value="">Select</option>{WEATHER_CONDITIONS.map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
          <div className="fld"><div className="lbl">Wind Direction</div>
            <select className="inp" value={newSession.wind} onChange={e=>setNewSession(s=>({...s,wind:e.target.value}))}>
              <option value="">Select</option>{WIND_DIRECTIONS.map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Wind Speed (mph)</div><input className="inp" type="number" value={newSession.windSpeed} onChange={e=>setNewSession(s=>({...s,windSpeed:e.target.value}))} placeholder="0"/></div>
          <div className="fld"><div className="lbl">Temperature (°C)</div><input className="inp" type="number" value={newSession.temp} onChange={e=>setNewSession(s=>({...s,temp:e.target.value}))} placeholder="15"/></div>
        </div>
        <hr className="dvd"/>
        <div className="lbl" style={{marginBottom:7}}>Quarry Bag — UK Legal Only</div>
        <div className="qg">
          {UK_QUARRY.map(q=>(
            <button key={q} className={`qi ${(newSession.quarryBag[q]||0)>0?"sel":""}`}
              onClick={()=>setNewSession(s=>({...s,quarryBag:{...s.quarryBag,[q]:(s.quarryBag[q]||0)+1}}))}>
              {q}{(newSession.quarryBag[q]||0)>0&&<strong> ×{newSession.quarryBag[q]}</strong>}
            </button>
          ))}
        </div>
        {Object.values(newSession.quarryBag).some(v=>v>0)&&
          <button className="btn bsm bdg" style={{marginTop:7}} onClick={()=>setNewSession(s=>({...s,quarryBag:{}}))}>Clear Bag</button>}
        <hr className="dvd"/>
        <div className="fld">
          <div className="lbl">Target Photos</div>
          <input type="file" accept="image/*" className="file-inp"
            onChange={e=>readImg(e.target.files[0],d=>setNewSession(s=>({...s,targetPhotos:[...s.targetPhotos,d]})))}/>
          {newSession.targetPhotos.length>0&&<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
            {newSession.targetPhotos.map((p,i)=>(
              <div key={i} style={{position:"relative"}}>
                <img src={p} alt="" style={{width:70,height:70,objectFit:"cover",borderRadius:8}}/>
                <button onClick={()=>setNewSession(s=>({...s,targetPhotos:s.targetPhotos.filter((_,idx)=>idx!==i)}))}
                  style={{position:"absolute",top:-4,right:-4,width:20,height:20,borderRadius:"50%",background:t.danger,color:"white",border:"none",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
              </div>
            ))}
          </div>}
        </div>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newSession.notes} onChange={e=>setNewSession(s=>({...s,notes:e.target.value}))} placeholder="Session notes..."/></div>

        </div>
      </div>

        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Landowner</div><input className="inp" value={newLand.owner} onChange={e=>setNewLand(l=>({...l,owner:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">Contact</div><input className="inp" value={newLand.contact} onChange={e=>setNewLand(l=>({...l,contact:e.target.value}))}/></div>
        </div>
        <div className="fld"><div className="lbl">Permission Date</div><input className="inp" type="date" value={newLand.permission} onChange={e=>setNewLand(l=>({...l,permission:e.target.value}))}/></div>
        <div className="fld">
          <div className="lbl" style={{marginBottom:7}}>Species Present</div>
          <div className="qg">{UK_QUARRY.slice(0,22).map(q=>(
            <button key={q} className={`qi ${newLand.species?.includes(q)?"sel":""}`}
              onClick={()=>setNewLand(l=>({...l,species:l.species?.includes(q)?l.species.filter(s=>s!==q):[...(l.species||[]),q]}))}>
              {q}
            </button>
          ))}</div>
        </div>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newLand.notes} onChange={e=>setNewLand(l=>({...l,notes:e.target.value}))}/></div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn bsl" onClick={save}>Save</button>
          <button className="btn" onClick={()=>setShowLandForm(false)}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  function MaintModal() {
    if(!showMaintForm) return null;
    const save = () => {
      if(!newMaint.firearmId) return;
      setMaintenance(m=>[...m,{...newMaint,id:gid()}]);
      setShowMaintForm(false); setNewMaint(blankMaint);
    };
    return <div className="ov" onClick={e=>{if(e.target.classList.contains("ov"))setShowMaintForm(false);}}>
      <div className="modal">
        <div className="mt">Log Maintenance<button className="xb" onClick={()=>setShowMaintForm(false)}>×</button></div>
        <div className="fld"><div className="lbl">Firearm *</div>
          <select className="inp" value={newMaint.firearmId} onChange={e=>setNewMaint(m=>({...m,firearmId:e.target.value}))}>
            <option value="">Select</option>{firearms.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
          </select>
        </div>
        <div className="row">
          <div className="fld"><div className="lbl">Date</div><input className="inp" type="date" value={newMaint.date} onChange={e=>setNewMaint(m=>({...m,date:e.target.value}))}/></div>
          <div className="fld"><div className="lbl">Service Type</div>
            <select className="inp" value={newMaint.type} onChange={e=>setNewMaint(m=>({...m,type:e.target.value}))}>
              <option value="">Select</option>
              {["Clean & Oil","Full Strip","Barrel Clean","Scope Check","Zero Check","Parts Replacement","Gunsmith Service","Annual Service"].map(x=><option key={x}>{x}</option>)}
            </select>
          </div>
        </div>
        <div className="fld"><div className="lbl">Parts / Materials</div><input className="inp" value={newMaint.parts} onChange={e=>setNewMaint(m=>({...m,parts:e.target.value}))} placeholder="e.g. Bore solvent, oil"/></div>
        <div className="fld"><div className="lbl">Notes</div><textarea className="inp" value={newMaint.notes} onChange={e=>setNewMaint(m=>({...m,notes:e.target.value}))}/></div>
        <div className="fld"><div className="lbl">Next Service Due</div><input className="inp" type="date" value={newMaint.nextDue} onChange={e=>setNewMaint(m=>({...m,nextDue:e.target.value}))}/></div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button className="btn bsl" onClick={save}>Save Record</button>
          <button className="btn" onClick={()=>setShowMaintForm(false)}>Cancel</button>
        </div>
      </div>
    </div>;
  }

  const PAGES = {dashboard:Dashboard,firearms:Firearms,ammo:Ammo,locations:Locations,sessions:Sessions,land:Land,maintenance:Maintenance,stats:Stats,feo:FEO,settings:Settings};

  return (
    <div className="app">
      <style dangerouslySetInnerHTML={{__html:css}}/>
      {theme==="night"&&<div className="nvscan"/>}
      <nav className="nav">
        <div className="nav-inner">
          {NAV.map(n=>(
            <button key={n.id} className={`nb ${page===n.id?"active":""}`} onClick={()=>setPage(n.id)}>
              <Icon name={n.icon} size={16}/>{n.label}
            </button>
          ))}
        </div>
      </nav>
      {(PAGES[page]||Dashboard)()}
      {FirearmModal()}
      {LocationModal()}
      {SessionModal()}
      {AmmoModal()}
      {LandModal()}
      {MaintModal()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</body>
</html>
